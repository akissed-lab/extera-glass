name: Build Extera Glass IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
  CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
  PROV_PROFILE: ${{ secrets.SIGNING_PROVISIONING_PROFILE }}
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Config.swift с реальными ключами лежит только локально (.gitignore).
      # На CI генерируем его из секретов — так api_hash не попадает в репозиторий.
      - name: Generate Config.swift from secrets
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Нужны GitHub Secrets TELEGRAM_API_ID и TELEGRAM_API_HASH"
            exit 1
          fi
          cat > ExteraGlass/Config.swift <<EOF
          import Foundation

          enum Config {
              static let apiID: Int = $API_ID
              static let apiHash: String = "$API_HASH"

              static let appVersion = "1.0.0"
              static let deviceModel = "ExteraGlass iOS"
              static let languageCode = Locale.current.language.languageCode?.identifier ?? "en"
          }
          EOF

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show versions
        run: xcodebuild -version

      - name: Resolve Swift packages (TDLibKit ~300 MB)
        run: |
          xcodebuild -project ExteraGlass.xcodeproj \
            -scheme ExteraGlass \
            -resolvePackageDependencies

      # ---------- Без подписи: ad-hoc IPA для сайдлоада ----------
      - name: Build unsigned app
        if: env.CERT_P12 == ''
        run: |
          xcodebuild -project ExteraGlass.xcodeproj \
            -scheme ExteraGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign and pack IPA
        if: env.CERT_P12 == ''
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ExteraGlass.app Payload/
          if [ -d Payload/ExteraGlass.app/Frameworks ]; then
            find Payload/ExteraGlass.app/Frameworks -maxdepth 1 -name '*.framework' -type d -print0 \
              | xargs -0 -I{} codesign --force --sign - --preserve-metadata=entitlements {}
          fi
          codesign --force --sign - --preserve-metadata=entitlements Payload/ExteraGlass.app
          zip -qry ExteraGlass-adhoc.ipa Payload
          ls -lh ExteraGlass-adhoc.ipa

      - name: Upload ad-hoc IPA
        if: env.CERT_P12 == ''
        uses: actions/upload-artifact@v4
        with:
          name: ExteraGlass-adhoc
          path: ExteraGlass-adhoc.ipa
          if-no-files-found: error

      # ---------- С подписью: нужен Apple Developer аккаунт ----------
      - name: Import signing certificate
        if: env.CERT_P12 != ''
        env:
          KEYCHAIN_PASS: ${{ github.run_id }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          echo "$PROV_PROFILE" | base64 --decode > profile.mobileprovision
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security find-identity -v -p codesigning

      - name: Archive with signing
        if: env.CERT_P12 != ''
        env:
          KEYCHAIN_PASS: ${{ github.run_id }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          xcodebuild -project ExteraGlass.xcodeproj \
            -scheme ExteraGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ExteraGlass.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: Export signed IPA
        if: env.CERT_P12 != ''
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.exteraglass.client</key><string>Extera Glass AdHoc</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ExteraGlass.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath export
          ls -lh export

      - name: Upload signed IPA
        if: env.CERT_P12 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ExteraGlass-signed
          path: export/*.ipa
          if-no-files-found: error
